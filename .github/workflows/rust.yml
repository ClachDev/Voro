name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain components
      run: rustup component add rustfmt clippy
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --workspace

  # The pinned version below must match `rust-version` in the workspace
  # Cargo.toml. Raising one without the other is what this job exists to catch.
  msrv:

    runs-on: ubuntu-latest

    env:
      MSRV: "1.88"

    steps:
    - uses: actions/checkout@v4
    - name: Install pinned toolchain
      run: rustup toolchain install $MSRV --profile minimal --no-self-update
    - name: Check the declared MSRV still compiles
      run: cargo +$MSRV check --workspace --all-targets
